<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vledger</title>
    <script>
      // Apply the stored theme before first paint (avoid a flash). vledger uses
      // light/dark (the validated data-viz palette), not the suite mono/fizx/upleb.
      try {
        var t = localStorage.getItem("vledger.theme");
        if (t === "dark" || t === "light")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
